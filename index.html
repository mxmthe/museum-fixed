<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Forum&family=Roboto:wght@200;400;500;700&display=swap"
    rel="stylesheet">
  <title>Museum</title>
</head>

<body>
  <header class="header">
    <div class="container header-section">
      <div class="logo">
        <img src="./assets/img/Vector.svg" alt="Museum-logo" class="logo-icon">
        <span class="logo-text">Louvre</span>
      </div>
      <nav class="main-menu">
        <ul class="menu-list">
          <li><a href="#visiting">Visiting</a></li>
          <li><a href="#explore">Explore</a></li>
          <li><a href="#video">Video</a></li>
          <li><a href="#gallery">Gallery</a></li>
          <li><a href="#tickets">Tickets</a></li>
          <li><a href="#contacts">Contacts</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main class="page">
    <div class="container">
      <section id="welcome" class="welcome">
          <h1 class="welcome-title">Welcome <br />to the Louvre</h1>
          <h2 class="welcome-subtitle">From the castle to the museum</h2>
          <a class="welcome-button" target="_blank" href="https://www.google.com/maps/@48.8618159,2.3366818,3a,75y,81.55h,73.4t/data=!3m7!1e1!3m5!1sAF1QipOVxZQuSy3Bx9T_HpH_7FtBHDTXvI6SF-A10ocT!2e10!3e12!7i5472!8i2736">
            <button><div class="button-text">Discover the Louvre</div></button>
          </a>
        </button>
        <div class="pagination">
          <div class="page-number">01 | 05</div>
          <div class="boxes">
            <div class="box active"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
          </div>
          <div class="arrows">
            <div class="arrow-left"><img src="./assets//img/arrow-left.svg"/></div>
            <div class="arrow-right"><img src="./assets//img/arrow-right.svg"/></div>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>

</html>
